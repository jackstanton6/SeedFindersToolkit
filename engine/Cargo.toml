[package]
name = "sft_engine"
version = "0.1.0"
edition = "2021"
description = "Seed Finders Toolkit engine: bit-exact Minecraft world generation + parallel seed search"
license = "MIT"

[lib]
name = "sft_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
md-5 = "0.11"
sha2 = "0.11"
flate2 = "1"
rayon = "1"
libloading = "0.9"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
