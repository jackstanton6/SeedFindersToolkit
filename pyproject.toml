[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "seedfinders-toolkit"
version = "0.1.0"
description = "Bit-exact Minecraft seed finding: Rust engine, PySide6 GUI, Rust/Python plugins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
sft = "sft.__main__:main"

[tool.maturin]
manifest-path = "engine/Cargo.toml"
module-name = "sft._engine"
features = ["python"]
python-packages = ["sft"]
